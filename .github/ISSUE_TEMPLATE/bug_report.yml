name: Bug report
description: Report a reproducible problem with the plugin
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove API keys, tokens and personal data from logs and screenshots.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select model ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "0.4.4"
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      placeholder: "0.2.2-rc.1"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and provider
      placeholder: "opencode-go / deepseek-v4.1-flash"
  - type: dropdown
    id: language
    attributes:
      label: DSH interface language
      options:
        - English
        - Русский
        - 中文
        - 日本語
        - Español
        - Français
        - Deutsch
        - Português
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Renderer console output and, for layout issues, a screenshot with the window size.
      render: shell
