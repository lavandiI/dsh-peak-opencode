name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish --dry-run only
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

# Публикация не должна идти параллельно: два запуска подряд — это две попытки
# опубликовать один и тот же номер.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-24.04
    # Окружение даёт точку контроля в настройках репозитория: сюда можно
    # добавить required reviewers, не меняя файл workflow.
    environment: npm
    env:
      TZ: Europe/Minsk
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
      - name: Check the version is not published yet
        run: |
          version=$(node -p "require('./package.json').version")
          published=$(npm view "dsh-peak-opencode@$version" version 2>/dev/null || true)
          if [ -n "$published" ]; then
            echo "dsh-peak-opencode@$published is already on npm; bump the version first" >&2
            exit 1
          fi
      - name: Publish to npm
        run: npm publish ${{ inputs.dry_run && '--dry-run' || '--provenance' }} --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
